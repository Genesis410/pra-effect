[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pra-effect"
version = "1.2.0"
description = "Zero-dependency local CLI for parsing, deduplicating, and fingerprinting Python & Node.js error stack traces."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Genesis410" }]
keywords = ["stacktrace", "deduplication", "cli", "incident-management", "logging", "developer-tools"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Logging",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Genesis410/pra-effect"
Repository = "https://github.com/Genesis410/pra-effect.git"
Issues = "https://github.com/Genesis410/pra-effect/issues"

[project.scripts]
pra-effect = "pra_effect:main"

[tool.setuptools]
py-modules = ["pra_effect"]